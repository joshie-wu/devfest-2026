version: '3.8'
services:
  api:
    build: ./api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - 8000:8000
    volumes:
      - ./api:/app
    env_file:
      - .env
  web:
    build: ./web
    ports:
      - 5173:5173
    volumes:
      - ./web:/app
    command: npm run dev -- --host
    working_dir: /app